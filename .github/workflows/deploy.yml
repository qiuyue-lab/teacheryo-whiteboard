name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy-api:
    # 数据 API Worker（Drizzle + D1）：先迁移库，再部署
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci
        working-directory: server

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply teacheryo-db --remote
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy teacheryo-api
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          workingDirectory: server
          command: deploy

  deploy-web:
    # 前端静态 Worker：组装 release + 注入 config.js（CONFIG_JS secret）
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble release
        run: |
          mkdir -p release
          cp index.html student.html config.js release/
          cp -r css js vendor release/
          # 云端模式：把填好 api 地址的 config.js 放进 GitHub Secret「CONFIG_JS」，
          # 推送时自动覆盖仓库里的空模板。没配 Secret 时保留空模板 = 本地模式。
          if [ -n "$CONFIG_JS" ]; then
            printf '%s\n' "$CONFIG_JS" > release/config.js
            echo "config.js: 使用 CONFIG_JS Secret（云端模式）"
          else
            echo "config.js: 使用仓库空模板（本地模式）"
          fi
          ls -la release
        env:
          CONFIG_JS: ${{ secrets.CONFIG_JS }}

      - name: Deploy teacheryo-whiteboard
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: deploy
